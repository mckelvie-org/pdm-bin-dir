name: Install Smoke Test

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Install source"
        required: true
        type: choice
        options:
          - github
          - testpypi
        default: github
      git_ref:
        description: "Git ref for github source (branch, tag, or sha)"
        required: false
        type: string
        default: main
      version:
        description: "Package version for testpypi source"
        required: false
        type: string

jobs:
  smoke-pip:
    name: "Smoke · pip install"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.source == 'github' && github.event.inputs.git_ref || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDM
        run: python -m pip install --no-cache-dir pdm

      - name: Read package name
        run: |
          PACKAGE=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['name'])")
          echo "PACKAGE=$PACKAGE" >> "$GITHUB_ENV"

      - name: Install from GitHub
        if: ${{ github.event.inputs.source == 'github' }}
        env:
          REF: ${{ github.event.inputs.git_ref }}
        run: |
          python -m pip install --no-cache-dir \
            "$PACKAGE @ git+https://github.com/${{ github.repository }}.git@$REF"

      - name: Install from TestPyPI
        if: ${{ github.event.inputs.source == 'testpypi' }}
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ -z "$VERSION" ]]; then
            echo "version input is required for testpypi source"
            exit 1
          fi
          python -m pip install --no-cache-dir \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            "$PACKAGE==$VERSION"

      # --- Customize the assertions below for your project ---
      - name: Smoke test import and exports
        run: |
          python - <<'PY'
          from pdm_bin_dir import (
              BinDirCommand,
              CONFIG_DIRS_KEY,
              CONFIG_GROUP,
              DEBUG_ENV_VAR,
              DEBUG_KEY,
              DEFAULT_BIN_DIRS,
              get_bin_dirs,
              get_bin_reldirs,
              plugin,
              __version__,
          )

          assert isinstance(__version__, str) and __version__ != "", f"bad __version__: {__version__!r}"
          assert CONFIG_GROUP == "tool.pdm.plugin.bin-dir"
          assert CONFIG_DIRS_KEY == "tool.pdm.plugin.bin-dir.dirs"
          assert DEBUG_ENV_VAR == "PDM_BIN_DIR_DEBUG"
          assert DEBUG_KEY == "tool.pdm.plugin.bin-dir.debug"
          assert DEFAULT_BIN_DIRS == []
          assert callable(plugin)
          assert callable(get_bin_reldirs)
          assert callable(get_bin_dirs)

          print(f"pdm-bin-dir version: {__version__}")
          print("pip install smoke test passed!")
          PY

  smoke-pdm:
    name: "Smoke · pdm self add"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.source == 'github' && github.event.inputs.git_ref || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDM
        run: python -m pip install --no-cache-dir pdm

      - name: Read package name
        run: |
          PACKAGE=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['name'])")
          echo "PACKAGE=$PACKAGE" >> "$GITHUB_ENV"

      - name: Install from GitHub via pdm self add
        if: ${{ github.event.inputs.source == 'github' }}
        env:
          REF: ${{ github.event.inputs.git_ref }}
        run: |
          pdm self add \
            --pip-args "--no-cache-dir" \
            "$PACKAGE @ git+https://github.com/${{ github.repository }}.git@$REF"

      - name: Install from TestPyPI via pdm self add
        if: ${{ github.event.inputs.source == 'testpypi' }}
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ -z "$VERSION" ]]; then
            echo "version input is required for testpypi source"
            exit 1
          fi
          pdm self add "$PACKAGE==$VERSION" \
            --pip-args "--index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ --no-cache-dir"

      # --- Customize the smoke test below for your project ---
      - name: Smoke test PDM plugin functionality
        run: |
          PROJDIR=$(mktemp -d)
          cat > "$PROJDIR/pyproject.toml" <<'EOF'
          [project]
          name = "smoke"
          version = "0.1.0"
          requires-python = ">=3.12"

          [tool.pdm.plugin.bin-dir]
          dirs = ["mybin"]
          EOF
          mkdir "$PROJDIR/mybin"
          cd "$PROJDIR"
          pdm install
          pdm run python - <<'PY'
          import os, pathlib
          path = os.environ['PATH']
          mybin = str(pathlib.Path('mybin').resolve())
          assert mybin in path.split(':'), f'{mybin!r} not found in PATH:\n{path}'
          print(f"mybin in PATH: {mybin}")
          print("pdm self add smoke test passed!")
          PY
