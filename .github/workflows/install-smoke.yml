name: Install Smoke Test

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Install source"
        required: true
        type: choice
        options:
          - github
          - testpypi
        default: github
      git_ref:
        description: "Git ref for github source (branch, tag, or sha)"
        required: false
        type: string
        default: main
      version:
        description: "Package version for testpypi source"
        required: false
        type: string

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDM
        run: python -m pip install --no-cache-dir pdm

      - name: Install from GitHub
        if: ${{ github.event.inputs.source == 'github' }}
        env:
          REF: ${{ github.event.inputs.git_ref }}
        run: |
          python -m pip install --no-cache-dir "pdm-bin-dir @ git+https://github.com/${{ github.repository }}.git@$REF"

      - name: Install from TestPyPI
        if: ${{ github.event.inputs.source == 'testpypi' }}
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ -z "$VERSION" ]]; then
            echo "version input is required for testpypi source"
            exit 1
          fi
          pdm self add "pdm-bin-dir==$VERSION" \
            --pip-args "--index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ --no-cache-dir"

      - name: Smoke test import and exports
        run: |
          python - <<'PY'
          from pdm_bin_dir import (
              BinDirCommand,
              CONFIG_DIRS_KEY,
              CONFIG_DIRS_SUBKEY,
              CONFIG_GROUP,
              DEFAULT_BIN_DIRS,
              get_bin_dirs,
              get_bin_reldirs,
              plugin,
              __version__,
          )

          assert isinstance(__version__, str) and __version__ != "", f"bad __version__: {__version__!r}"
          assert CONFIG_GROUP == "tool.pdm.plugin.bin-dir"
          assert CONFIG_DIRS_SUBKEY == "dirs"
          assert CONFIG_DIRS_KEY == "tool.pdm.plugin.bin-dir.dirs"
          assert DEFAULT_BIN_DIRS == []
          assert callable(plugin)
          assert callable(get_bin_reldirs)
          assert callable(get_bin_dirs)

          print(f"pdm-bin-dir version: {__version__}")
          print("Smoke test passed!")
          PY
