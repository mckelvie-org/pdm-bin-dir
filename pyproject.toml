[build-system]
requires = ["pdm-backend>=2.4.0"]
build-backend = "pdm.backend"

[project]
name = "pdm-bin-dir"
version = "1.0.8-dev.1"
description = "PDM plugin that allows additional directories listed in pyproject.toml to be added to environment PATH"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "Sam McKelvie", email = "dev@emckelvie.org" },
]
keywords = ["pdm", "plugin", "path", "environment", "bin", "virtualenv", "script", "activate"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = [
  "pdm>=2.0",
  "typing-extensions>=4.8; python_version < '3.12'",
]

[project.urls]
Homepage = "https://github.com/mckelvie-org/pdm-bin-dir"
Source = "https://github.com/mckelvie-org/pdm-bin-dir"
"Bug Tracker" = "https://github.com/mckelvie-org/pdm-bin-dir/issues"
Changelog = "https://github.com/mckelvie-org/pdm-bin-dir/releases"

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "ruff>=0.6.0",
    "pdm>=2.27.0",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["pdm_bin_dir"]

[project.entry-points.pdm]
bin-path = "pdm_bin_dir:plugin"

[tool.pdm]
distribution = true

[tool.pdm.build]
includes = ["pdm_bin_dir"]

[tool.pdm.scripts]
test = "pytest"
lint = "ruff check ."
typecheck = "mypy pdm_bin_dir"
